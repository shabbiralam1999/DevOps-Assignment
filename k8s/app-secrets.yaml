# DEV-ONLY placeholder values so `kubectl apply` works on a laptop.
# The pipeline never applies this file to preprod/release: it creates `app-secrets`
# from the GitHub Environment secrets DB_USER / DB_PASSWORD instead.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: dev
type: Opaque
stringData:
  DB_USER: appuser
  DB_PASSWORD: apppass
