apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dev
  labels: { app: backend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend, tier: api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: backend
          image: ghcr.io/shabbiralam1999/node-react-postgres-platform-assessment-backend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef: { name: app-config }
          env:
            # order matters: $(VAR) can only reference variables defined above it
            - name: DB_HOST
              valueFrom: { configMapKeyRef: { name: app-config, key: DB_HOST } }
            - name: DB_READ_HOST
              valueFrom: { configMapKeyRef: { name: app-config, key: DB_READ_HOST } }
            - name: DB_PORT
              valueFrom: { configMapKeyRef: { name: app-config, key: DB_PORT } }
            - name: DB_NAME
              valueFrom: { configMapKeyRef: { name: app-config, key: DB_NAME } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: app-secrets, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: DB_PASSWORD } }
            - name: DB_WRITE_URL
              value: postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)
            - name: DB_READ_URL
              value: postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_READ_HOST):$(DB_PORT)/$(DB_NAME)
          readinessProbe:               # gates traffic: needs the database
            httpGet: { path: /api/health/ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:                # restarts only if the process itself is stuck
            httpGet: { path: /api/health/live, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 500m, memory: 384Mi }
