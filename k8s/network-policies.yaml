# Platform services stay internal: only the app tier may connect to them.
# (Enforced only when the CNI supports NetworkPolicy, e.g. Calico/Cilium; kind's default kindnet ignores them.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-app-only
  namespace: dev
spec:
  podSelector: { matchLabels: { app: postgres } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: backend } }
      ports: [{ port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-allow-app-only
  namespace: dev
spec:
  podSelector: { matchLabels: { app: redis } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: backend } }
        - podSelector: { matchLabels: { app: bullmq-worker } }
      ports: [{ port: 6379 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: search-allow-app-only
  namespace: dev
spec:
  podSelector: { matchLabels: { app: search } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: backend } }
      ports: [{ port: 9200 }]
