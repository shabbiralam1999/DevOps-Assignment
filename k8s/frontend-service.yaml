# NodePort: direct access without the Ingress (http://localhost:30080 on kind via the port mapping)
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: dev
spec:
  type: NodePort
  selector: { app: frontend }
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
